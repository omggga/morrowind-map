server {
    listen 127.0.0.1:9003 default_server;
    server_name _;

    root /srv/morrowind-map/current;
    index index.html;

    server_tokens off;
    charset utf-8;
    etag on;
    sendfile on;
    tcp_nopush on;

    include /etc/nginx/snippets/morrowind-map-security.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/css
        application/json
        application/javascript
        image/svg+xml;
    gzip_static on;

    access_log /var/log/nginx/morrowind-map.access.log;
    error_log /var/log/nginx/morrowind-map.error.log;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/morrowind-map-security.conf;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/morrowind-map-security.conf;
    }

    location = /datasets/index.json {
        try_files $uri @dataset_not_found;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/morrowind-map-security.conf;
    }

    location ^~ /datasets/manifests/ {
        try_files $uri @dataset_not_found;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/morrowind-map-security.conf;
    }

    location ^~ /datasets/generated/ {
        alias /srv/morrowind-map/data/generated/;
        error_page 404 = @dataset_not_found;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/morrowind-map-security.conf;

        access_log off;
        log_not_found off;
    }

    location ^~ /datasets/metadata/ {
        try_files $uri @dataset_not_found;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/morrowind-map-security.conf;

        access_log off;
        log_not_found off;
    }

    location ^~ /datasets/ {
        try_files $uri @dataset_not_found;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/morrowind-map-security.conf;
    }

    location /assets/ {
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/morrowind-map-security.conf;

        access_log off;
    }

    # Ubuntu 22.04's bundled mime.types does not define woff2.
    location ~* \.woff2$ {
        default_type font/woff2;
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/morrowind-map-security.conf;

        access_log off;
    }

    location @dataset_not_found {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/morrowind-map-security.conf;
        return 404;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
