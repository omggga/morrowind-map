# Install as root in /etc/ssh/sshd_config.d/60-morrowind-map-deploy.conf.
# The deploy user can publish site files but cannot edit its authorized keys.
Match User morrowind-map
    AuthorizedKeysFile /etc/ssh/authorized_keys/morrowind-map
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    DisableForwarding yes
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY no
    PermitUserRC no
Match all
