name: Dataset review (trusted)
run-name: dataset-review-v2:pr:${{ inputs.pr_number }}:head:${{ inputs.expected_head || inputs.bootstrap_sha }}:base:${{ inputs.expected_base }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR to review (zero when bootstrapping a baseline)
        required: false
        default: 0
        type: number
      bootstrap_sha:
        description: Exact trusted main baseline to bootstrap instead of a PR
        required: false
        default: ''
        type: string
      expected_head:
        description: Exact current PR head SHA (required for a PR review)
        required: false
        default: ''
        type: string
      expected_base:
        description: Exact current PR base SHA (required for a PR review)
        required: false
        default: ''
        type: string
      source_mapping:
        description: JSON array of dataset identities and source repository/release IDs
        required: false
        default: '[]'
        type: string
      legacy_transport:
        description: Explicit transport for historical snapshots (bootstrap always uses releases)
        required: true
        default: lfs
        type: choice
        options:
          - lfs
          - releases

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      candidate_sha: ${{ steps.freeze.outputs.candidate_sha }}
      pr_number: ${{ steps.freeze.outputs.pr_number }}
      receipt_sha: ${{ steps.review.outputs.receipt_sha }}
    steps:
      - name: Checkout the pinned trusted tools only
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze PR or bootstrap identity and structured sources
        id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BOOTSTRAP_SHA: ${{ inputs.bootstrap_sha }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          EXPECTED_BASE: ${{ inputs.expected_base }}
          SOURCE_MAPPING: ${{ inputs.source_mapping }}
          LEGACY_TRANSPORT: ${{ inputs.legacy_transport }}
        run: python3 -m tools.deployment.dataset_review_workflow freeze --work-root "$RUNNER_TEMP/dataset-review"
      - name: Validate both snapshots as data and prepare the bound review receipt
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.deployment.dataset_review_workflow review --work-root "$RUNNER_TEMP/dataset-review"
      - name: Upload only the review report and receipt
        uses: actions/upload-artifact@v7
        with:
          name: dataset-review-${{ steps.freeze.outputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dataset-review/report/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified immutable dataset packages
    needs: review
    if: github.ref == 'refs/heads/main' && needs.review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: read
      actions: read
    environment:
      name: dataset-publication
    concurrency:
      group: dataset-package-publication
      cancel-in-progress: false
    steps:
      - name: Checkout the same pinned trusted tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download this attempt's trusted receipt
        uses: actions/download-artifact@v8
        with:
          name: dataset-review-${{ needs.review.outputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dataset-publication/input/
      - name: Reverify receipt-bound source bytes and publish canonical packages
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_SHA: ${{ needs.review.outputs.receipt_sha }}
          IMMUTABLE_RELEASES_CONFIRMED: ${{ vars.IMMUTABLE_RELEASES_CONFIRMED }}
        run: python3 -m tools.deployment.dataset_review_workflow publish --work-root "$RUNNER_TEMP/dataset-publication"
      - name: Retain compact publication evidence
        uses: actions/upload-artifact@v7
        with:
          name: dataset-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dataset-publication/result/
          if-no-files-found: error
          retention-days: 7

  result:
    name: Attach trusted review result to PR commit
    needs: [review, publish]
    if: always() && github.ref == 'refs/heads/main' && needs.review.outputs.candidate_sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: write
      actions: read
    steps:
      - name: Checkout the same pinned trusted result tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download successful publication binding
        if: needs.publish.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: dataset-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dataset-result/
      - name: Attach a durable check only after review and publication
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.review.outputs.pr_number }}
          CANDIDATE_SHA: ${{ needs.review.outputs.candidate_sha }}
          RECEIPT_SHA: ${{ needs.review.outputs.receipt_sha }}
          PUBLICATION_SUCCESS: ${{ needs.review.result == 'success' && needs.publish.result == 'success' }}
        run: python3 -m tools.deployment.dataset_review_workflow finish --work-root "$RUNNER_TEMP/dataset-result"
